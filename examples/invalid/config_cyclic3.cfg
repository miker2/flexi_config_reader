
# Each of these is an expression that references another expression, and the last one references
# the first, so following the chain never reaches a value. Unlike config_cyclic1.cfg, where the
# cycle is made of plain value lookups, this one is a cycle of expressions.

start = {{ $(middle) + 1 }}   # This is part of a cyclic reference

middle = {{ $(end) * 2 }}     # This is part of a cyclic reference

end = {{ $(start) - 3 }}      # This is part of a cyclic reference
