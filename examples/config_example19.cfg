
# A chain of expressions, each one referencing a key whose value is itself an expression.
#
# The keys are deliberately declared in the opposite order to their dependencies: 'chained' needs
# 'scaled', which needs 'doubled', which needs 'base', and 'base' comes last. Resolving a chain
# has to follow it wherever the keys happen to sit in the file.

struct math_chain {
  chained = {{ $(math_chain.scaled) * 2 }}   # -> 10

  scaled = {{ $(math_chain.doubled) + 1 }}   # -> 5

  doubled = {{ $(math_chain.base) * 2 }}     # -> 4

  base = 2
}
