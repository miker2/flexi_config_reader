include config_example20_base.cfg

# Overriding a key inside a struct that came from a proto. The struct written here is an ordinary
# one, and the struct it merges with was declared inside a proto, so the two have to be treated as
# the same kind of thing once the proto has been instantiated.

struct shapes {
  struct first {
    struct dims {
      width [override] = 7
    }
  }
}

# A list may likewise combine a struct written by hand with one that came from a proto.
mixed_list = [ $(shapes.first.style), $(shapes.second.style) ]
